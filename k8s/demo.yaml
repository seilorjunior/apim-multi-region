apiVersion: v1
kind: Namespace
metadata:
  name: private-poc
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
__SOURCE_CONFIG_MAP__
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regional-demo
  namespace: private-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: regional-demo
  template:
    metadata:
      labels:
        app: regional-demo
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: regional-demo
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: regional-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "__DEMO_IMAGE__"
__CONTAINER_COMMAND__
          env:
            - name: REGION
              value: "__REGION__"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
__SOURCE_MOUNT__
__SOURCE_VOLUME__
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: regional-demo
  namespace: private-poc
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: regional-demo
---
apiVersion: v1
kind: Service
metadata:
  name: regional-demo
  namespace: private-poc
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: aks
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "__BACKEND_IP__"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - "__APIM_SUBNET__"
  selector:
    app: regional-demo
  ports:
    - name: http
      port: 80
      targetPort: http
