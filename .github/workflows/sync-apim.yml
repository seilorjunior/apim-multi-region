name: Sync both private APIMs
on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Existing provisioned azd environment name
        required: true
        default: poc-apim-private
      dry_run:
        description: Preview without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: azure-provision-${{ inputs.environment_name }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  sync:
    needs: validate
    runs-on: windows-2025
    environment: azure-deployment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require protected environment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $protected = gh api "repos/$env:GH_REPO/environments/azure-deployment" --jq 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)'
          if ($LASTEXITCODE -ne 0 -or $protected -ne 'true') { throw 'Configure required reviewers on azure-deployment first.' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked APIOps CLI
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'APIOps dependency installation failed.' }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify privacy and sync both instances
        shell: pwsh
        env:
          APIM_SYNC_ENVIRONMENT_JSON: ${{ vars.APIM_SYNC_ENVIRONMENT_JSON }}
          EXPECTED_ENVIRONMENT: ${{ inputs.environment_name }}
          EXPECTED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          . .\scripts\ps1\Common.ps1
          . .\scripts\ps1\ApiOps.ps1
          $values = $env:APIM_SYNC_ENVIRONMENT_JSON | ConvertFrom-Json -AsHashtable
          if ($values -isnot [System.Collections.IDictionary]) { throw 'Configure APIM_SYNC_ENVIRONMENT_JSON from the provisioned azd environment.' }
          if ((Get-RequiredValue $values 'AZURE_ENV_NAME') -cne $env:EXPECTED_ENVIRONMENT -or
              (Get-RequiredValue $values 'AZURE_SUBSCRIPTION_ID') -ine $env:EXPECTED_SUBSCRIPTION) {
            throw 'APIM sync configuration does not match the requested environment/subscription.'
          }
          Invoke-ApimSync -Values $values -DryRun:($env:DRY_RUN -eq 'true')
