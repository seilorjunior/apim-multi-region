name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build demo image without publication
        shell: bash
        run: |
          set -euo pipefail
          python_version=$(jq -r .python scripts/toolchain.json)
          base="docker.io/library/python:$python_version-alpine"
          docker pull "$base"
          base_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base")
          docker build --pull --build-arg "PYTHON_IMAGE=$base_digest" -t regional-demo:validation src/demo
      - uses: ./.github/actions/container-smoke
        with:
          image: regional-demo:validation
  native-bash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned versions
        id: versions
        shell: bash
        run: echo "python=$(jq -r .python scripts/toolchain.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Install pinned native tools
        shell: bash
        run: bash scripts/bash/install-ci-tools.sh
      - name: Install test dependencies
        shell: bash
        run: python3 -m pip install -r requirements-test.txt
      - name: Run native suites
        shell: bash
        env:
          REQUIRE_BASH_TESTS: "1"
        run: bash scripts/bash/invoke-validation.sh --require-pinned-tools
  local:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned versions
        id: versions
        shell: pwsh
        run: |
          $versions = Get-Content .\scripts\toolchain.json -Raw | ConvertFrom-Json
          "python=$($versions.python)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Install pinned PowerShell and Bicep
        shell: pwsh
        run: .\scripts\ps1\Install-CiTools.ps1
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install -r .\requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed.' }
      - name: Run local suites
        shell: pwsh
        run: .\scripts\ps1\Invoke-Validation.ps1 -RequirePinnedTools
