  <text x="522" y="446" text-anchor="end" class="body">Brazil South</text>
  <text x="693" y="447" class="section">ESTADOS UNIDOS</text>
  <text x="1112" y="446" text-anchor="end" class="body">East US</text>

  <rect x="85" y="470" width="440" height="112" rx="12" fill="#ffffff" stroke="#ae98cc" class="outline"/>
  <rect x="675" y="470" width="440" height="112" rx="12" fill="#ffffff" stroke="#ae98cc" class="outline"/>
  <rect x="85" y="485" width="4" height="80" rx="2" fill="#8860b0"/>
  <rect x="675" y="485" width="4" height="80" rx="2" fill="#8860b0"/>
  <text x="108" y="501" class="label">APIM Standard v2 Brasil</text>
  <text x="698" y="501" class="label">APIM Standard v2 EUA</text>
  <text x="108" y="527" class="body">Instancia independente | politicas e auth</text>
  <text x="698" y="527" class="body">Instancia independente | politicas e auth</text>
  <rect x="108" y="542" width="300" height="25" rx="6" fill="#f0eafa"/>
  <rect x="698" y="542" width="300" height="25" rx="6" fill="#f0eafa"/>
  <text x="120" y="559" class="small">Gateway: acesso publico desabilitado</text>
  <text x="710" y="559" class="small">Gateway: acesso publico desabilitado</text>

  <rect x="78" y="612" width="454" height="271" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#8ab6a0" stroke-dasharray="5 4"/>
  <rect x="668" y="612" width="454" height="271" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#8faed0" stroke-dasharray="5 4"/>
  <text x="98" y="636" class="eyebrow">VNET BRASIL / SAIDA</text>
  <text x="688" y="636" class="eyebrow">VNET EUA / SAIDA</text>
  <path d="M305 582 V651" class="flow"/>
  <path d="M895 582 V651" class="flow"/>

  <rect x="105" y="653" width="400" height="61" rx="9" fill="#e9f4f1" stroke="#a9cdbf" class="outline"/>
  <rect x="695" y="653" width="400" height="61" rx="9" fill="#eaf1fa" stroke="#b4cae5" class="outline"/>
  <text x="305" y="679" text-anchor="middle" class="label">Integracao de VNet de saida</text>
  <text x="895" y="679" text-anchor="middle" class="label">Integracao de VNet de saida</text>
  <text x="305" y="701" text-anchor="middle" class="small">Subnet de integracao | DNS e regras de rede</text>
  <text x="895" y="701" text-anchor="middle" class="small">Subnet de integracao | DNS e regras de rede</text>
  <path d="M305 714 V758" class="flow"/>
  <path d="M895 714 V758" class="flow"/>
  <text x="320" y="742" class="small">HTTPS privado</text>
  <text x="910" y="742" class="small">HTTPS privado</text>

  <rect x="105" y="760" width="400" height="102" rx="12" fill="#ffffff" stroke="#6fa9d1" class="outline"/>
  <rect x="695" y="760" width="400" height="102" rx="12" fill="#ffffff" stroke="#6fa9d1" class="outline"/>
  <text x="305" y="789" text-anchor="middle" class="section">AKS privado Brasil</text>
  <text x="895" y="789" text-anchor="middle" class="section">AKS privado EUA</text>
  <text x="305" y="815" text-anchor="middle" class="body">Gateway/Ingress interno → APIs e servicos</text>
  <text x="895" y="815" text-anchor="middle" class="body">Gateway/Ingress interno → APIs e servicos</text>
  <text x="305" y="840" text-anchor="middle" class="small">API server privado | backend local</text>
  <text x="895" y="840" text-anchor="middle" class="small">API server privado | capacidade de failover</text>
  <path d="M305 862 V914" class="flow"/>
  <path d="M895 862 V914" class="flow"/>

  <rect x="85" y="916" width="440" height="76" rx="12" fill="#e0f2e9" stroke="#9ac8b1" class="outline"/>
  <rect x="675" y="916" width="440" height="76" rx="12" fill="#e0f2e9" stroke="#9ac8b1" class="outline"/>
  <text x="305" y="946" text-anchor="middle" class="label">Dados e dependencias Brasil*</text>
  <text x="895" y="946" text-anchor="middle" class="label">Dados e dependencias EUA*</text>
  <text x="305" y="973" text-anchor="middle" class="small">Banco, filas e segredos | acesso privado</text>
  <text x="895" y="973" text-anchor="middle" class="small">Replicacao e promocao conforme servico</text>
  <path d="M525 958 H673" class="replica"/>
  <text x="600" y="936" text-anchor="middle" class="small">Replicacao*</text>

  <rect x="60" y="1040" width="1080" height="75" rx="14" fill="#ffffff" stroke="#ccd8e4" class="outline"/>
  <rect x="60" y="1054" width="4" height="46" rx="2" fill="#8860b0"/>
  <text x="85" y="1069" class="label">Uma fonte de configuracao. Dois destinos de entrega.</text>
  <text x="85" y="1095" class="body">Pipeline → APIM Brasil e EUA + aplicacoes AKS | APIs, politicas e credenciais coordenadas</text>

  <text x="60" y="1150" class="label">Sem proxies em VMs. Sem balanceador intermediario antes do APIM.</text>
  <text x="60" y="1177" class="body">O ingresso interno do AKS permanece. Private Endpoints de entrada sao gerenciados pelo Front Door.</text>
  <text x="60" y="1203" class="body">Probe: Front Door → Private Link → APIM → aplicacao AKS. Falha regional desvia novas chamadas.</text>
  <text x="60" y="1229" class="small">* Dados exigem estrategia propria: definir RPO/RTO, promocao e LGPD. Nao ha sincronizacao nativa entre os APIM.</text>
  <path d="M60 1250 H1140" stroke="#d7e1eb" fill="none"/>
  <text x="60" y="1274" class="small">Proposta conceitual | Validar disponibilidade regional e capacidade antes da implantacao.</text>
  <text x="60" y="1297" class="small">Entrada privada de APIs nao privatiza automaticamente portal, gestao ou dependencias de plataforma.</text>
</svg>
